services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dsmbc-2026
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
      - NEXTAUTH_URL=http://localhost:3000
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
